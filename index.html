
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zimska liga Liganj 2026./27.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#172033;font-family:Arial,sans-serif}
header{background:#12345a;color:white;padding:22px 16px;text-align:center}
header h1{font-size:23px;margin:0 0 6px}header p{margin:0;color:#d5e4f5}
main{max-width:900px;margin:auto;padding:15px}
.card{background:white;border-radius:12px;padding:16px;margin:13px 0;box-shadow:0 2px 8px #0001}
h2{font-size:19px;margin:0 0 13px;color:#12345a}
button{background:#145da0;color:white;border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}
input{padding:11px;border:1px solid #ccd3dd;border-radius:7px;max-width:100%;width:100%;margin:5px 0}
.small{font-size:13px;color:#657184}.match{border-top:1px solid #e5e9ef;padding:12px 0}
.score{font-weight:bold;font-size:18px}.tag{font-size:12px;color:#52647a}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 5px;border-bottom:1px solid #e5e9ef;text-align:left}th{color:#52647a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{width:75px}
.hidden{display:none}.error{color:#b42318}.success{color:#167344}
</style>
</head>
<body>
<header>
<h1>ZIMSKA LIGA LIGANJ</h1>
<p>Sezona 2026./27.</p>
</header>
<main>
<section class="card">
<h2>Prijava administratora</h2>
<div id="login">
<input id="email" type="email" placeholder="E-mail administratora">
<input id="password" type="password" placeholder="Lozinka">
<button onclick="login()">Prijava</button>
</div>
<div id="userbox" class="hidden">
<span id="useremail"></span>
<button onclick="logout()">Odjava</button>
</div>
<p id="status" class="small">Učitavanje lige...</p>
</section>

<section class="card">
<h2>Tablica</h2>
<div id="standings">Učitavanje tablice...</div>
</section>

<section class="card">
<h2>Raspored i rezultati</h2>
<div id="matches">Učitavanje utakmica...</div>
</section>

<section class="card">
<h2>Klubovi</h2>
<div id="clubs">Učitavanje klubova...</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://hlmhddswjqdklahxvwhd.supabase.co";
const SUPABASE_KEY = "sb_publishable_SY4sIKXwqFHo4URa83EZag_pgn0TB5W";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null, canEdit=false, allMatches=[], allClubs=[], allResults=[];

const pick=(o,keys)=>{for(const k of keys)if(o[k]!==undefined&&o[k]!==null)return o[k];return "";};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clubName=id=>{const c=allClubs.find(x=>String(x.id)===String(id));return c?c.name:"Klub "+id;};

async function init(){
  const {data:{session}}=await db.auth.getSession();
  currentUser=session?.user||null;
  await refresh();
  db.auth.onAuthStateChange(async(_event,session)=>{
    currentUser=session?.user||null;
    await refresh();
  });
}
async function refresh(){
  document.getElementById("login").classList.toggle("hidden",!!currentUser);
  document.getElementById("userbox").classList.toggle("hidden",!currentUser);
  document.getElementById("useremail").textContent=currentUser?.email||"";
  canEdit=false;
  if(currentUser){
    const {data:p}=await db.from("profiles").select("role").eq("id",currentUser.id).maybeSingle();
    canEdit=!!p&&["owner","admin"].includes(p.role);
  }
  const [c,m,r]=await Promise.all([
    db.from("clubs").select("*").order("id"),
    db.from("matches").select("*").order("id"),
    db.from("discipline_results").select("*")
  ]);
  if(c.error||m.error||r.error){
    document.getElementById("status").innerHTML='<span class="error">Greška pri učitavanju: '+esc(c.error?.message||m.error?.message||r.error?.message)+'</span>';
    return;
  }
  allClubs=c.data||[];allMatches=m.data||[];allResults=r.data||[];
  document.getElementById("status").textContent=canEdit?"Prijavljeni ste kao administrator.":"Javni prikaz – samo pregled rezultata.";
  showClubs();showMatches();showStandings();
}
async function login(){
  const {error}=await db.auth.signInWithPassword({
    email:document.getElementById("email").value,
    password:document.getElementById("password").value
  });
  if(error)alert("Greška prijave: "+error.message);
  else await refresh();
}
async function logout(){await db.auth.signOut();await refresh();}
function showClubs(){
  document.getElementById("clubs").innerHTML=allClubs.map(c=>"<div class='match'>"+esc(c.name)+"</div>").join("");
}
function showMatches(){
  const groups={};
  allMatches.forEach(m=>{
    const round=pick(m,["round","round_no","round_number"]);
    (groups[round]??=[]).push(m);
  });
  document.getElementById("matches").innerHTML=Object.keys(groups).sort((a,b)=>Number(a)-Number(b)).map(round=>
    "<h3>"+(round?"Kolo "+esc(round):"Utakmice")+"</h3>"+
    groups[round].map(m=>{
      const id=m.id;
      const home=pick(m,["home_club_id","home_team_id","home"]);
      const away=pick(m,["away_club_id","away_team_id","away"]);
      const date=pick(m,["match_date","date","played_at"]);
      const jogi=pick(m,["jogi","court","playing_area"]);
      const disciplines=["TROJKA","PAR1","PAR2","POJEDINAC"];
      const scores=disciplines.map(d=>{
        const r=allResults.find(x=>String(x.match_id)===String(id)&&String(x.discipline).toUpperCase()===d);
        const hs=pick(r||{},["home_score","score_home","home_points"]);
        const as=pick(r||{},["away_score","score_away","away_points"]);
        return `<div class="small">${d}: <b>${r?esc(hs)+" : "+esc(as):"–"}</b></div>`;
      }).join("");
      return `<div class="match">
        <div class="tag">${esc(date)} ${jogi?" · Jogi "+esc(jogi):""}</div>
        <b>${esc(clubName(home))} – ${esc(clubName(away))}</b>
        ${scores}
        ${canEdit?disciplines.map(d=>{
          const r=allResults.find(x=>String(x.match_id)===String(id)&&String(x.discipline).toUpperCase()===d);
          return `<div class="row small">${d}
            <input id="h-${id}-${d}" type="number" min="0" placeholder="Domaći" value="${r?esc(pick(r,["home_score","score_home","home_points"])):""}">
            :
            <input id="a-${id}-${d}" type="number" min="0" placeholder="Gosti" value="${r?esc(pick(r,["away_score","score_away","away_points"])):""}">
            <button onclick="saveResult('${id}','${d}')">Spremi</button>
          </div>`;
        }).join(""):""}
      </div>`;
    }).join("")
  ).join("");
}
async function saveResult(matchId,discipline){
  if(!canEdit){alert("Nemate ovlasti za unos.");return;}
  const h=document.getElementById(`h-${matchId}-${discipline}`).value;
  const a=document.getElementById(`a-${matchId}-${discipline}`).value;
  if(h===""||a===""){alert("Upišite oba rezultata.");return;}
  if(!confirm("Spremiti rezultat "+h+":"+a+" za "+discipline+"?"))return;
  const existing=allResults.find(x=>String(x.match_id)===String(matchId)&&String(x.discipline).toUpperCase()===discipline);
  let result;
  if(existing){
    result=await db.from("discipline_results").update({home_score:Number(h),away_score:Number(a)}).eq("id",existing.id);
  }else{
    result=await db.from("discipline_results").insert({match_id:matchId,discipline,home_score:Number(h),away_score:Number(a)});
  }
  if(result.error){alert("Greška: "+result.error.message);return;}
  alert("Rezultat je spremljen.");
  await refresh();
}
async function showStandings(){
  const {data,error}=await db.from("league_standings").select("*");
  if(error){document.getElementById("standings").textContent="Tablica trenutno nije dostupna.";return;}
  if(!data?.length){document.getElementById("standings").textContent="Tablica će se popuniti nakon unosa rezultata.";return;}
  const rows=[...data].sort((a,b)=>
    Number(pick(b,["points","total_points"]))-Number(pick(a,["points","total_points"]))||
    Number(pick(b,["point_difference","points_difference","difference"]))-Number(pick(a,["point_difference","points_difference","difference"]))
  );
  document.getElementById("standings").innerHTML="<table><tr><th>#</th><th>Klub</th><th>Bod.</th><th>Razlika</th></tr>"+
  rows.map((r,i)=>`<tr><td>${i+1}.</td><td>${esc(pick(r,["club_name","name"]))}</td><td>${esc(pick(r,["points","total_points"]))}</td><td>${esc(pick(r,["point_difference","points_difference","difference"]))}</td></tr>`).join("")+"</table>";
}
init();
</script>
</body>
</html>
